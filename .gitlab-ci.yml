stages:
  - format
  - test
  - deploy

python-formatting:
  stage: format
  image: python:3.12
  before_script:
    - pip install flake8
  script:
    - flake8 .

unit-tests:
  stage: test
  image: python:3.12
  needs: ["python-formatting"]
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest

deploy-to-tsuru:
  stage: deploy
  needs: ["unit-tests"]
  image: ubuntu:latest
  variables:
    TSURU_TARGET: https://impaas.uk
    APP_NAME: movie-explorer
  before_script:
    - apt-get update
    - apt-get install -y curl
    - curl -fsSL "https://tsuru.io/get" | bash
    - export TSURU_TOKEN="$IMPAAS_DEPLOY_TOKEN"
    - tsuru target add impaas "$TSURU_TARGET" -s
  script:
    - tsuru app deploy -a "$APP_NAME" .
  only:
    - master
    - feature/integration